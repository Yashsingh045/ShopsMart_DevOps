name: Production CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: cd client && npm ci

      - name: Run Linter
        run: cd client && npm run lint

      - name: Run Tests (if defined)
        run: cd client && npm run test --if-present

      - name: Build Application
        run: cd client && npm run build

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: cd server && npm ci

      - name: Run Linter
        run: cd server && npm run lint

      - name: Run Tests
        run: cd server && npm run test

  deploy:
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.EC2_TARGET_DIR }}
            cd ${{ secrets.EC2_TARGET_DIR }}
            if [ ! -d ".git" ]; then
              git clone https://github.com/Yashsingh045/ShopsMart_DevOps.git .
            fi
            git fetch origin main
            git reset --hard origin/main
            chmod +x dev-setup.sh dev-services.sh
            ./dev-setup.sh
            ./dev-services.sh stop
            ./dev-services.sh start
