name: Production CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: cd client && npm ci

      - name: Run Linter
        run: cd client && npm run lint

      - name: Run Tests (if defined)
        run: cd client && npm run test --if-present

      - name: Build Application
        run: cd client && npm run build

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: cd server && npm ci

      - name: Run Linter
        run: cd server && npm run lint

      - name: Run Tests
        run: cd server && npm run test

  deploy:
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail

            # ── Ensure Node.js is on PATH (non-interactive SSH does not source ~/.bashrc) ──
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            if ! command -v node &>/dev/null; then
              echo "[INFO] Node.js not found; installing via NodeSource..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            echo "[INFO] node: $(node --version), npm: $(npm --version)"

            TARGET_DIR=${{ secrets.EC2_TARGET_DIR }}
            ENV_FILE="$TARGET_DIR/server/.env"
            ENV_BACKUP="/tmp/.shopsMart-env.backup"

            mkdir -p "$TARGET_DIR"

            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" "$ENV_BACKUP"
              echo "[INFO] .env backed up with DATABASE_URL"
            fi

            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "[INFO] First deployment - cloning repository..."
              cd "$TARGET_DIR"
              find . -maxdepth 1 ! -name '.' -exec rm -rf {} +
              git clone https://github.com/Yashsingh045/ShopsMart_DevOps.git .
            else
              echo "[INFO] Updating existing repository..."
              cd "$TARGET_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            if [ -f "$ENV_BACKUP" ]; then
              mkdir -p server
              cp "$ENV_BACKUP" "$ENV_FILE"
              echo "[INFO] .env restored with DATABASE_URL"
            else
              echo "[ERROR] No .env backup found - database connection will fail!"
              exit 1
            fi

            chmod +x dev-setup.sh dev-services.sh
            ./dev-setup.sh
            ./dev-services.sh stop
            ./dev-services.sh start
